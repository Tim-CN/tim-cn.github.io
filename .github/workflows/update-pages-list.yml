name: Update Pages List and Deploy

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate pages list
        run: |
          # 获取所有公开仓库（排除自身）
          repos=$(gh api users/tim-cn/repos --paginate --jq '.[] | select(.name != "tim-cn.github.io") | .name')
          echo "Found repos: $repos"

          echo '[]' > pages-list.json

          for repo in $repos; do
            echo "::group::Checking $repo"

            # 获取 Pages 信息，不要静默错误，便于调试
            pages_info=$(gh api "repos/tim-cn/$repo/pages" 2>&1)
            api_exit_code=$?
            echo "API exit code: $api_exit_code"
            echo "Raw pages_info: $pages_info"

            if [ $api_exit_code -ne 0 ]; then
              echo "  API call failed, skipping."
              echo "::endgroup::"
              continue
            fi

            # 提取 html_url（注意：可能为 null）
            html_url=$(echo "$pages_info" | jq -r '.html_url // ""')
            echo "Extracted html_url: '$html_url'"

            # 只要 html_url 非空就收录（这是站点可访问的最直接证据）
            if [ -z "$html_url" ] || [ "$html_url" = "null" ]; then
              echo "  No html_url found, skipping."
              echo "::endgroup::"
              continue
            fi

            # 获取仓库描述
            description=$(gh api "repos/tim-cn/$repo" --jq '.description // ""')
            echo "  Adding $repo -> $html_url"

            # 追加到 JSON
            jq --arg name "$repo" --arg url "$html_url" --arg desc "$description" \
              '. += [{"name": $name, "url": $url, "description": $desc}]' \
              pages-list.json > tmp.json && mv tmp.json pages-list.json

            echo "::endgroup::"
          done

          echo "Final pages-list.json:"
          cat pages-list.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-list.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto update pages list"
          git push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
